name: Deploy Frontend

# Manual only. Builds the SPA and pushes it to an already-existing S3 bucket +
# CloudFront distribution via plain AWS CLI — no Terraform anywhere in this workflow.
# Terraform is a local-only tool for this project (see Doc/deployment.md): it
# provisions/updates infrastructure, but never runs in CI, and this workflow never
# touches its state. The bucket/distribution/API URL come from repo variables, copied
# once from `terraform output` after infra is applied — update them if those resources
# are ever recreated.
on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to deploy (matches the repo variables' target)"
        required: true
        default: prod

permissions:
  id-token: write # required to assume the AWS role via OIDC — no access keys stored anywhere
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC — no long-lived keys)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Build frontend
        working-directory: App-code/frontend
        run: |
          npm ci
          npm run build
        env:
          VITE_API_BASE_URL: ${{ vars.API_BASE_URL }}
          VITE_COGNITO_DOMAIN: ${{ vars.COGNITO_DOMAIN }}
          VITE_COGNITO_CLIENT_ID: ${{ vars.COGNITO_CLIENT_ID }}
          VITE_COGNITO_IDP_NAME: ${{ vars.COGNITO_IDP_NAME }}

      - name: Sync frontend to S3
        run: aws s3 sync App-code/frontend/dist "s3://${{ vars.FRONTEND_BUCKET_NAME }}" --delete

      - name: Invalidate CloudFront cache
        run: aws cloudfront create-invalidation --distribution-id "${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}" --paths "/*"
